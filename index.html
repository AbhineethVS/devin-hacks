<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Syntune: your code, played as music." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Syntune: your code, played as music</title>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <i data-lucide="audio-waveform" aria-hidden="true"></i>
          <span class="wordmark">Syntune</span>
        </div>
        <label class="field">
          <i data-lucide="list-music" aria-hidden="true"></i>
          <span class="sr-only">Preset</span>
          <select id="preset"></select>
        </label>
        <label class="field">
          <i data-lucide="code-xml" aria-hidden="true"></i>
          <span class="sr-only">Language</span>
          <select id="lang"></select>
        </label>
        <label class="field field-grow">
          <i data-lucide="link" aria-hidden="true"></i>
          <span class="sr-only">GitHub URL</span>
          <input
            id="github-url"
            type="url"
            placeholder="Paste a GitHub file or repo URL"
            disabled
            title="GitHub loading arrives with Card 7"
          />
        </label>
        <button id="sounds-like" class="btn btn-ghost" disabled title="Arrives with Card 8">
          <i data-lucide="sparkles" aria-hidden="true"></i>
          Sounds like…
        </button>
      </header>

      <main class="stage">
        <section class="editor-pane" id="editor" aria-label="Code"></section>
        <section class="viz-pane" aria-label="Visualizer">
          <canvas id="viz"></canvas>
          <div class="viz-empty">
            <p>Press <kbd>Play file</kbd> or <kbd>Run</kbd> to see your code move.</p>
          </div>
        </section>
      </main>

      <div class="status" id="status" role="status" aria-live="polite">Ready</div>

      <footer class="transport">
        <div class="group">
          <button id="play-file" class="btn btn-primary">
            <i data-lucide="play" aria-hidden="true"></i>
            Play file
          </button>
          <button id="run" class="btn btn-secondary">
            <i data-lucide="zap" aria-hidden="true"></i>
            Run
          </button>
          <button id="stop" class="btn btn-ghost" aria-label="Stop">
            <i data-lucide="square" aria-hidden="true"></i>
          </button>
        </div>
        <label class="group bpm">
          <i data-lucide="gauge" aria-hidden="true"></i>
          <input id="bpm" type="range" min="70" max="180" value="112" aria-label="Tempo (BPM)" />
          <output id="bpm-value" for="bpm">112</output><span class="unit">BPM</span>
        </label>
        <div class="group chips" id="packs" role="radiogroup" aria-label="Sound pack"></div>
        <label class="group toggle">
          <input id="backing" type="checkbox" checked />
          <i data-lucide="drum" aria-hidden="true"></i>
          Backing
        </label>
        <div class="group">
          <button class="btn btn-ghost" disabled title="Arrives with Card 10">
            <i data-lucide="share-2" aria-hidden="true"></i>
            Share
          </button>
          <button class="btn btn-ghost" disabled title="Arrives with Card 10">
            <i data-lucide="download" aria-hidden="true"></i>
            Export
          </button>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
